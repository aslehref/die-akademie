name: Bauen und auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur ein Deploy gleichzeitig. Ein laufender wird nicht abgebrochen,
# damit keine halb veröffentlichte Seite online bleibt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typen prüfen
        run: npm run check

      - name: Code-Stil prüfen
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Bauen
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # GitHub Pages veröffentlicht unter https://<name>.github.io/<repo>/
          # Der Unterpfad muss also dem Repository-Namen entsprechen. Stünde er
          # hier fest im Text und das Repo würde umbenannt, wären alle Links
          # kaputt – deshalb kommt er direkt von GitHub.
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'build/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
